<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openlbx plan</title>
<style>
:root{
  --bg:#f6f6f2;--panel:#ffffff;--ink:#1f2328;--mute:#6b7178;--line:#d9d9d2;--edge:#b9c9bd;--hl:#2f6fd0;
  --done:#dcefe2;--done-b:#7fbf95;--partial:#e6f3df;--partial-b:#5fa878;--running:#fdebc8;--running-b:#e0a93b;
  --ready:#e3ecfb;--ready-b:#6f95d8;--waiting:#efefec;--waiting-b:#cfcfc8;--blocked:#fbe1e1;--blocked-b:#d86f6f;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14171a;--panel:#1c2024;--ink:#e6e8ea;--mute:#9aa1a8;--line:#30363d;--edge:#3d5145;--hl:#6ea8ff;
  --done:#1d3a28;--done-b:#3f8a5a;--partial:#22381f;--partial-b:#5fa878;--running:#4a3a14;--running-b:#c9952e;
  --ready:#1c2c4a;--ready-b:#4f78c4;--waiting:#24282c;--waiting-b:#454b52;--blocked:#4a1f1f;--blocked-b:#c45a5a;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
header{position:fixed;inset:0 0 auto 0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:8px 14px}
h1{font-size:17px;margin:0 6px 0 0;white-space:nowrap}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat b{font-size:14px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--mute)}
input#q{width:170px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--hl)}
button[aria-pressed="true"]{background:var(--ready);border-color:var(--ready-b)}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
path.e{fill:none;stroke:var(--edge);stroke-width:1.2}
path.e.hl{stroke:var(--hl);stroke-width:2.2}
path.e.dim{opacity:.18}
.n{position:absolute;border:1px solid;border-radius:6px;padding:5px 8px;cursor:pointer;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.n .id{font:600 11.5px ui-monospace,SFMono-Regular,Consolas,monospace}
.n .ms{float:right;font-size:9.5px;color:var(--mute)}
.n .t{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n .x{font-size:10.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.n .k{display:flex;gap:12px;margin-top:4px;font-size:10px;color:var(--mute)}
.n .k b{display:block;color:var(--ink);font-size:11px}
.ml{position:absolute;text-align:center;font-size:20px;font-weight:600;color:var(--mute);white-space:nowrap}
.n.dim{opacity:.28}
.n.sel{outline:2px solid var(--hl);outline-offset:1px}
.n.match{outline:2px dashed var(--running-b);outline-offset:1px}
.s-done{background:var(--done);border-color:var(--done-b)}
.s-partial{background:var(--partial);border-color:var(--partial-b);border-style:dashed}
.s-running{background:var(--running);border-color:var(--running-b)}
.s-ready{background:var(--ready);border-color:var(--ready-b)}
.s-waiting{background:var(--waiting);border-color:var(--waiting-b)}
.s-blocked{background:var(--blocked);border-color:var(--blocked-b)}
aside{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);z-index:6;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px;overflow:auto;transform:translateX(100%);transition:transform .15s}
aside.open{transform:none}
aside h2{font-size:14px;margin:16px 0 6px}
aside h2:first-of-type{margin-top:0}
aside table{border-collapse:collapse;width:100%;font-size:11.5px}
aside td,aside th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
aside .close{float:right}
.foot{position:fixed;left:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:4;font-size:11px;color:var(--mute)}
.ctl{display:flex;align-items:center;gap:6px}
button{white-space:nowrap}
#legend{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
@media (max-width: 760px){
  header{gap:6px 12px;padding:6px 10px calc(6px) 10px;padding-top:calc(6px + env(safe-area-inset-top))}
  h1{font-size:15px}
  .stat.opt{display:none}
  .pills{display:none}
  .ctl{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .ctl::-webkit-scrollbar{display:none}
  .ctl button{min-height:38px;padding:6px 12px;flex:none}
  input#q{flex:1 0 130px;width:auto;min-height:38px;font-size:16px}
  aside{top:auto;left:0;right:0;bottom:0;width:100%;height:46dvh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(100%);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  aside.open{transform:none}
  aside .close{min-height:38px}
  .foot{font-size:10px}
}
</style>
</head>
<body>
<header>
  <h1>openlbx plan</h1>
  <div id="stats" style="display:flex;gap:16px;flex-wrap:wrap"></div>
  <div class="ctl">
    <input id="q" type="search" placeholder="Find a package" aria-label="Find a package">
    <button id="zin" title="Zoom in" aria-label="Zoom in">+</button><button id="zout" title="Zoom out" aria-label="Zoom out">&minus;</button>
    <button id="fit">Fit all</button><button id="prog">In progress</button>
    <button id="direct" aria-pressed="false" title="Highlight only direct neighbours of the selected package">Direct edges</button>
    <button id="info">Tests &amp; decisions</button>
  </div>
  <div class="pills" id="pills"></div>
</header>
<div id="stage"><div id="world"><svg id="edges"></svg></div></div>
<aside id="side"><button class="close" id="closeSide">Close</button><div id="sideBody"></div></aside>
<div class="foot" id="foot"></div>

function prep(data) {

  // One layered column per milestone, side by side; layers count only dependencies inside the milestone.
  const memo = {}, own = (n, ids) => ids.filter(d => BY[d].ms === n.ms);
  const layer = id => memo[id] ?? (memo[id] = own(BY[id], BY[id].deps).length ? 1 + Math.max(...own(BY[id], BY[id].deps).map(layer)) : 0);
  const bary = (n, ids) => ids.length ? ids.reduce((a, id) => a + BY[id].o, 0) / ids.length : n.o;
  let x0 = 0; LABELS = [];
  for (const m of data.milestones) {
    const rows = [];
    for (const n of N.filter(n => n.ms === m.id)) { n.l = layer(n.id); (rows[n.l] ??= []).push(n); n.h = n.st === "running" ? 112 : n.note ? 76 : 46; }
    rows.forEach(r => r.forEach((n, i) => n.o = i));
    for (let s = 0; s < 6; s++) {
      const seq = s % 2 ? [...rows].reverse() : rows;
      for (const r of seq) { r.forEach(n => n.b = bary(n, own(n, s % 2 ? n.kids : n.deps))); r.sort((a, b) => a.b - b.b); r.forEach((n, i) => n.o = i); }
    }
    const width = Math.max(...rows.map(r => r.length * W + (r.length - 1) * GX));
    let y = 0;
    for (const r of rows) {
      const tot = r.length * W + (r.length - 1) * GX;
      r.forEach((n, i) => { n.x = x0 + (width - tot) / 2 + i * (W + GX); n.y = y; });
      y += Math.max(...r.map(n => n.h)) + GY;
    }
    LABELS.push({x: x0, w: width, text: m.title});
    x0 += width + 150;
  }
}

function card(n) {

function chain(id) {
  const out = new Set([id]);
  if (direct) { BY[id].deps.forEach(d => out.add(d)); BY[id].kids.forEach(d => out.add(d)); return out; }
  const walk = (i, key) => BY[i][key].forEach(j => { if (!out.has(j)) { out.add(j); walk(j, key); } });
  const up = new Set([id]), down = new Set([id]);
  (function a(i) { BY[i].deps.forEach(j => { if (!up.has(j)) { up.add(j); a(j); } }); })(id);
  (function b(i) { BY[i].kids.forEach(j => { if (!down.has(j)) { down.add(j); b(j); } }); })(id);
  return new Set([...up, ...down]);
}

function mark() {

  document.querySelectorAll("path.e").forEach(p => {

    p.classList.toggle("hl", on); p.classList.toggle("dim", !!set && !on);

}

function apply() { $("world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; }

  const top = document.querySelector("header").offsetHeight + 12, vw = innerWidth, vh = innerHeight - top - 28;
  const x0 = Math.min(...list.map(n => n.x)), x1 = Math.max(...list.map(n => n.x + W)), y0 = Math.min(...list.map(n => n.y)) - 70, y1 = Math.max(...list.map(n => n.y + n.h));

stage.addEventListener("click", e => {
  if (moved) { moved = false; return; }
  const el = document.elementFromPoint(e.clientX, e.clientY)?.closest(".n");
  sel = el ? (sel === el.dataset.id ? null : el.dataset.id) : null; mark(); side(); if (sel) $("side").classList.add("open");
});
stage.addEventListener("wheel", e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, {passive: false});
$("zin").onclick = () => zoom(1.25); $("zout").onclick = () => zoom(0.8);
$("fit").onclick = () => fit(N); $("prog").onclick = () => fit(N.filter(n => n.st === "running" || n.st === "ready"));
$("direct").onclick = e => { direct = !direct; e.currentTarget.setAttribute("aria-pressed", direct); mark(); };
$("info").onclick = () => $("side").classList.toggle("open"); $("closeSide").onclick = () => $("side").classList.remove("open");
$("q").addEventListener("input", mark);
$("q").addEventListener("keydown", e => { if (e.key !== "Enter") return; const q = e.target.value.trim().toLowerCase(); const hit = N.filter(n => (n.id + " " + n.title).toLowerCase().includes(q)); if (q && hit.length) fit(hit); });
addEventListener("resize", () => apply());
if (INLINE) load(INLINE, true);
refresh(); setInterval(refresh, 60000);
</script>
</body>
</html>
